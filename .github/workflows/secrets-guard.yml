name: Secrets Guard

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  no-tracked-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fail if any .env file is tracked
      run: |
        # .env.example / .env.sample are templates and are allowed.
        tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.(example|sample)$' || true)
        if [ -n "$tracked" ]; then
          echo "::error::Tracked .env file(s) found — these must never be committed:"
          echo "$tracked"
          echo "Fix: git rm --cached <file>  (keeps your local copy), then rotate anything it exposed."
          exit 1
        fi
        echo "OK: no tracked .env files."

    - name: Fail if a template carries a filled-in secret
      run: |
        # Templates must ship empty values for secret-ish keys, so a real
        # credential can never reach the repo via .env.example.
        # A line may opt out with a trailing `# template-ok:<reason>` marker, for
        # non-credential defaults like the local-only Postgres password.
        bad=0
        for f in $(git ls-files | grep -E '\.env\.(example|sample)$' || true); do
          hits=$(grep -nE '^[A-Z0-9_]*(SECRET|KEY|PASSWORD|TOKEN)[A-Z0-9_]*=.*[^=[:space:]]' "$f" \
                 | grep -vE '=(""|'"''"')?[[:space:]]*$' \
                 | grep -v '# template-ok' || true)
          if [ -n "$hits" ]; then
            echo "::error file=$f::Template has non-empty secret value(s):"
            echo "$hits"
            bad=1
          fi
        done
        [ "$bad" -eq 0 ] && echo "OK: templates carry no filled-in secrets."
        exit $bad
