<div class="product-dashboard px-4 pt-2 relative z-10">
    <ng-container *transloco="let t">
    <ng-container *ngIf="stats$ | async as stats">
        <!-- KPI Cards Row - Marketing Style -->
        <div class="kpi-cards">
            <app-stat-card [title]="t('products.productDashboard.statProducts')" [value]="stats.totalProducts" icon="inventory_2" colorType="primary"
                link="/products">
            </app-stat-card>

            <app-stat-card [title]="t('products.productDashboard.statInventoryValue')"
                [value]="(stats.totalInventoryValue | currency:'USD':'symbol':'1.0-0') ?? ''" icon="payments"
                colorType="success" link="/products">
            </app-stat-card>

            <app-stat-card [title]="t('products.productDashboard.statLowStock')" [value]="stats.lowStockCount" icon="warning" colorType="warn"
                link="/products">
            </app-stat-card>

            <app-stat-card [title]="t('products.productDashboard.statStockHealth')" [value]="stats.stockHealthPercentage + '%'" icon="health_and_safety"
                colorType="accent" link="/products">
            </app-stat-card>
        </div>

        <div class="widgets-row">
            <app-inventory-health-widget class="widget-lg" [title]="t('products.productDashboard.lowStockAlerts')" [products]="stats.lowStockProducts">
            </app-inventory-health-widget>

            <div class="placeholder-widget">
                <div class="text-center">
                    <div class="placeholder-icon">
                        <mat-icon>bar_chart</mat-icon>
                    </div>
                    <p class="placeholder-title">{{ t('products.productDashboard.categoryBreakdown') }}</p>
                    <p class="placeholder-subtitle">{{ t('products.productDashboard.comingSoon') }}</p>
                </div>
            </div>
        </div>
    </ng-container>
    </ng-container>
</div>
