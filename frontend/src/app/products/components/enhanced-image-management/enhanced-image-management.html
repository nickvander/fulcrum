<ng-container *transloco="let t">
  <div class="image-management-container">
    <div class="image-list-header">
      <h3>{{ t('products.enhancedImageManagement.productImages') }}</h3>
      <span class="image-count">{{ t('products.enhancedImageManagement.imageCount', { count: images.length }) }}</span>
    </div>

    <div
      cdkDropList
      class="image-list"
      (cdkDropListDropped)="onReorder($event)">

      @for (image of images; track trackByFn($index, image)) {
        <div
          cdkDrag
          [cdkDragData]="image"
          class="image-item"
          [class.primary]="image.is_primary === 1">
          <div class="image-info">
            <img
              [src]="getImageUrl(image.image_path)"
              [alt]="image.title || t('products.enhancedImageManagement.productImageAlt')"
              class="image-preview"
              (error)="onImageError($event)">
            <div class="image-details">
              @if (image.title) {
                <div class="image-title">{{ image.title }}</div>
              }
              @if (image.description) {
                <div class="image-description">{{ image.description }}</div>
              }
              <div class="alt-text-input">
                <label>{{ t('products.enhancedImageManagement.altTextLabel') }}</label>
                <input
                  type="text"
                  [value]="image.title || ''"
                  (input)="onAltTextChange(image.id, $any($event.target).value)"
                  [placeholder]="t('products.enhancedImageManagement.altTextPlaceholder')">
              </div>
            </div>
          </div>
          <div class="image-actions">
            <button
              mat-icon-button
              cdkDragHandle
              [matTooltip]="t('products.enhancedImageManagement.dragToReorder')">
              <mat-icon>drag_indicator</mat-icon>
            </button>
            <button
              mat-icon-button
              [color]="image.is_primary === 1 ? 'accent' : 'basic'"
              (click)="setAsPrimary(image.id)"
              [matTooltip]="image.is_primary === 1 ? t('products.enhancedImageManagement.primaryImage') : t('products.enhancedImageManagement.setAsPrimary')">
              <mat-icon>star</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              (click)="deleteImage(image.id)"
              [matTooltip]="t('products.enhancedImageManagement.deleteImage')">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</ng-container>
