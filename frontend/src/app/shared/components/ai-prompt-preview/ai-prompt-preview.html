<ng-container *transloco="let t">
<div class="ai-prompt-preview" [class.expanded]="expanded" [class.has-content]="hasContent">
    <!-- Collapsed Header -->
    <button type="button" class="preview-header" (click)="toggleExpanded()" [disabled]="!hasContent"
        [matTooltip]="hasContent ? (expanded ? t('shared.aiPromptPreview.collapseTooltip') : t('shared.aiPromptPreview.expandTooltip')) : t('shared.aiPromptPreview.emptyTooltip')">
        <div class="header-left">
            <mat-icon class="ai-icon ai-accent">psychology</mat-icon>
            <span class="header-title">{{ t('shared.aiPromptPreview.title') }}</span>
            <span class="token-badge ai-accent__chip" *ngIf="hasContent">
                ~{{ getTokenEstimate() }} {{ t('shared.aiPromptPreview.tokens') }}
            </span>
        </div>
        <mat-icon class="expand-icon" *ngIf="hasContent">
            {{ expanded ? 'expand_less' : 'expand_more' }}
        </mat-icon>
    </button>

    <!-- Expanded Content -->
    <div class="preview-content" *ngIf="expanded && hasContent">
        <!-- Tone Section -->
        <div class="prompt-section" *ngIf="tonePrompt">
            <div class="section-header">
                <mat-icon>mood</mat-icon>
                <span>{{ t('shared.aiPromptPreview.tone') }}</span>
            </div>
            <div class="section-body">
                <pre class="prompt-text">{{ tonePrompt }}</pre>
            </div>
        </div>

        <!-- Channel Guidelines Section -->
        <div class="prompt-section" *ngIf="channelGuidelines">
            <div class="section-header">
                <mat-icon>campaign</mat-icon>
                <span>{{ t('shared.aiPromptPreview.channelGuidelines') }}</span>
            </div>
            <div class="section-body">
                <pre class="prompt-text">{{ channelGuidelines }}</pre>
            </div>
        </div>

        <!-- Custom Prompt Section -->
        <div class="prompt-section" *ngIf="customPrompt">
            <div class="section-header">
                <mat-icon>edit_note</mat-icon>
                <span>{{ t('shared.aiPromptPreview.customPrompt') }}</span>
            </div>
            <div class="section-body">
                <pre class="prompt-text">{{ customPrompt }}</pre>
            </div>
        </div>
    </div>
</div>
</ng-container>
