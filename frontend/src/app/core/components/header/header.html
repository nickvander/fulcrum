<mat-toolbar class="app-header" *transloco="let t">
  <button type="button" [attr.aria-label]="t('nav.menu')" [matTooltip]="t('nav.menu')" mat-icon-button
    (click)="onMenu()" class="sidenav-toggle">
    <mat-icon>menu</mat-icon>
  </button>
  <div class="logo-container">
    <span class="logo-mark" [class.logo-mark--syncing]="syncing" aria-hidden="true"></span>
    <span class="logo">Fulcrum</span>
  </div>
  <span class="spacer"></span>
</mat-toolbar>
